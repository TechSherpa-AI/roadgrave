<!DOCTYPE html>
<!--
=============================================================================
 ROADGRAVE — a car-combat RPG for iPhone Safari.
 This file is a shell: styles + app root. Game code lives in /js as plain
 ES modules (no build step). See docs/ARCHITECTURE.md.
=============================================================================
 NOTES
-----------------------------------------------------------------------------
 CHANGELOG
   0.4.0  Milestone 3 — architecture stabilization & living world:
          modular ES-module codebase (docs/ARCHITECTURE.md), save v4 with
          chained migrations + pre-migration backup, World State (career
          counters, structured history flags), multidimensional reputation
          (fame/respect/fear/popularity) + 8 factions, NPC registry with
          persistent memory (Crucible rivals remember and escalate),
          data-driven dialogue engine (data-dialogue.js) with weights and
          anti-repeat, crowd allegiance tiers (unknown->legend) shaping
          entrances/ambience/win/loss reactions, town + bar ambient events,
          6x3 character appearance (narrative metadata, dialogue can query),
          journal/biography (structured data + rendered prose), per-vehicle
          service history, legacy system (performance 1-100 separate from
          ~17 archetype endings; retire + ironman death both judged),
          Kettle Rock map navigation with tappable hotspots, video splash
          screen, schematic shows rig name, armored chassis portraits,
          regression suite (tests/run.mjs) gating deploys, golden saves,
          hidden debug panel (?dev=1).
   0.3.x  Slice 2: The Crucible (tactical combat), narrative pass, rig
          schematic, backdrop art.  0.2.0 Slice 1: creation/workshop/economy.
          0.1.0 Slice 0: scaffold.

 KNOWN GAPS
   - Slice 3 (overland travel) NOT implemented by design this milestone;
     schema is ready (fuel/water/food, mileage, settlements lists).
   - Character appearance layer ART not yet produced (18 layers specced in
     docs/ASSET_REQUIREMENTS.md); appearance is functional as metadata.
   - Companions/crew, contracts, moral-consequence events: architecture
     ready (NPC model, history flags), content deferred.
   - Map overlays (posters, champion markings) supported conceptually via
     hotspot layer; overlay art deferred.
   - XP is banked but not yet spendable (progression lands with campaign).
=============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ROADGRAVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROADGRAVE">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:,">
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#2a323c;
    --ink:#e8e6df; --dim:#9aa3ad; --amber:#e8b04a; --green:#7fd067;
    --red:#e06055; --blue:#6fa8dc;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:17px/1.45 -apple-system,"SF Mono",Menlo,system-ui,sans-serif;
    height:100%; overscroll-behavior:none;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);}
  #app{display:flex; flex-direction:column; min-height:100dvh;}

  header{display:flex; justify-content:space-between; align-items:baseline; gap:8px;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;}
  header .t{font-weight:700; letter-spacing:.12em; color:var(--amber); white-space:nowrap;}
  header .stat{color:var(--dim); font-size:13px; text-align:right;}
  header .stat b{color:var(--ink); font-weight:600;}

  main{flex:1; padding:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:12px; max-width:560px; width:100%; margin:0 auto;}

  h1{font-size:34px; letter-spacing:.18em; color:var(--amber); margin:0; text-align:center;}
  h2{font-size:15px; text-transform:uppercase; letter-spacing:.14em; color:var(--dim);
     margin:6px 0 0; border-bottom:1px solid var(--line); padding-bottom:6px;}
  p{margin:0;}
  .dim{color:var(--dim); font-size:15px;}
  .flavor{color:var(--dim); font-style:italic; font-size:15px;}
  .warn{color:var(--red);} .good{color:var(--green);}

  img.hero{width:100%; max-height:26vh; object-fit:cover; display:block;
    border-radius:12px; border:1px solid var(--line);}

  /* splash: looping video with still fallback; name always overlaid */
  .splashwrap{position:relative; width:100%; aspect-ratio:16/9; border-radius:12px;
    overflow:hidden; border:1px solid var(--line); background:#000;}
  .splashwrap img, .splashwrap video{position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover;}
  .splashname{position:absolute; inset:0; display:flex; align-items:flex-end;
    justify-content:center; padding-bottom:8px;
    background:linear-gradient(to bottom, transparent 55%, rgba(11,13,16,.85));}
  .splashname h1{font-size:32px; text-shadow:0 2px 8px #000;}

  /* Kettle Rock map navigation */
  .mapwrap{position:relative; width:100%; border-radius:12px; overflow:hidden;
    border:1px solid var(--line);}
  .mapwrap img{width:100%; display:block;}
  .mapwrap.noimg{display:none;}
  .maphot{position:absolute; min-height:0; width:auto; padding:0;
    background:rgba(232,176,74,.06); border:1px solid rgba(232,176,74,.55);
    border-radius:8px; box-shadow:0 0 10px rgba(232,176,74,.15);}
  .maphot:active{background:rgba(232,176,74,.25);}

  button{display:block; width:100%; min-height:52px; padding:12px 16px;
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font:inherit; font-size:16px; text-align:left; cursor:pointer;}
  button:active{background:#242b34;}
  button.primary{border-color:var(--amber); color:var(--amber); font-weight:600;}
  button.danger{border-color:var(--red); color:var(--red);}
  button.small{min-height:44px; font-size:15px; padding:8px 12px;}
  button.mini{min-height:40px; width:48px; text-align:center; font-size:20px; padding:4px;}
  button:disabled{opacity:.4;}
  button .sub{display:block; font-size:13px; color:var(--dim); font-weight:400; margin-top:2px;}
  button.chip{display:inline-block; width:auto; min-height:38px; padding:6px 12px;
    font-size:14px; border-radius:999px;}
  button.chip.sel{border-color:var(--amber); color:var(--amber);}
  .approw{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .applbl{color:var(--dim); font-size:13px; width:86px; flex:none;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:10px; align-items:center;}
  .row .grow{flex:1;}
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .kv{display:flex; justify-content:space-between; font-size:15px; gap:8px;}
  .kv span:first-child{color:var(--dim);}
  input[type=text], textarea{width:100%; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:10px; font:inherit;}
  textarea{min-height:110px; font:14px/1.4 Menlo,monospace;}
  label.toggle{display:flex; justify-content:space-between; align-items:center;
    min-height:48px; font-size:16px;}
  input[type=checkbox]{width:28px; height:28px; accent-color:var(--amber);}
  .msg{min-height:20px; font-size:14px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}

  .statbar{position:sticky; top:49px; z-index:4; background:var(--panel);
    border:1px solid var(--line); border-radius:10px; padding:8px 10px;
    display:grid; grid-template-columns:repeat(4,1fr); gap:4px; font-size:12.5px;}
  .statbar div{text-align:center;}
  .statbar .lbl{color:var(--dim); display:block; font-size:10.5px; text-transform:uppercase; letter-spacing:.08em;}

  .track{display:grid; grid-template-columns:repeat(3,1fr); gap:2px;
    background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:6px;}
  .track .cell{height:24px; border-radius:4px; background:var(--panel2);
    display:flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; color:var(--dim);}
  .track .cell.p{background:#3a3010; color:var(--amber); border:1px solid var(--amber);}
  .track .cell.e{background:#3a1512; color:var(--red); border:1px solid var(--red);}
  .track .cell.pe{background:#3a2210; color:var(--ink); border:1px solid var(--red);}
  .pips{letter-spacing:2px;}
  .pips .on{color:var(--amber);} .pips .off{color:#3a4048;}
  .hullpips .on{color:var(--green);} .hullpips .off{color:#3a4048;}
  .btnrow{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px;}
  .btnrow button{min-height:46px; text-align:center; font-size:15px; padding:6px;}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
