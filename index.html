<!DOCTYPE html>
<!--
=============================================================================
 ROADGRAVE — a car-combat RPG for iPhone Safari. Single file, no dependencies,
 no network. Add to Home Screen for full-screen play.
=============================================================================
 NOTES
-----------------------------------------------------------------------------
 CHANGELOG
   0.1.0  Slice 0 (scaffold): dark UI shell, screen state machine, central G
          state object, seeded RNG, versioned autosave to localStorage,
          export/import save string, ironman toggle (stored, not yet
          enforced), placeholder Town Hub and Settings screens.

 KNOWN GAPS
   - All gameplay screens (Garage, Market, Jobs, Bar, Arena) are placeholders;
     they land in Slices 1-2.
   - Driver creation not yet built (Slice 1); a stub driver is generated.
   - Ironman toggle is saved but has no behavioral effect yet.
   - Save migration chain has only v1; future versions append migrations.
   - Roguelike run structure + meta-progression: deliberately deferred (plan).
=============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ROADGRAVE</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="ROADGRAVE">
<meta name="theme-color" content="#0b0d10">
<style>
  :root{
    --bg:#0b0d10; --panel:#14181d; --panel2:#1b2027; --line:#2a323c;
    --ink:#e8e6df; --dim:#9aa3ad; --amber:#e8b04a; --green:#7fd067;
    --red:#e06055; --focus:#3d80c2;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; background:var(--bg); color:var(--ink);
    font:17px/1.45 -apple-system,"SF Mono",Menlo,system-ui,sans-serif;
    height:100%; overscroll-behavior:none;}
  body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);}
  #app{display:flex; flex-direction:column; min-height:100dvh;}

  header{display:flex; justify-content:space-between; align-items:baseline;
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:5;}
  header .t{font-weight:700; letter-spacing:.12em; color:var(--amber);}
  header .stat{color:var(--dim); font-size:14px;}
  header .stat b{color:var(--ink); font-weight:600;}

  main{flex:1; padding:14px; padding-bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:12px; max-width:560px; width:100%; margin:0 auto;}

  h1{font-size:34px; letter-spacing:.18em; color:var(--amber); margin:0; text-align:center;}
  h2{font-size:15px; text-transform:uppercase; letter-spacing:.14em; color:var(--dim);
     margin:6px 0 0; border-bottom:1px solid var(--line); padding-bottom:6px;}
  p{margin:0; color:var(--ink);}
  .dim{color:var(--dim); font-size:15px;}
  .flavor{color:var(--dim); font-style:italic; font-size:15px;}

  button{display:block; width:100%; min-height:52px; padding:12px 16px;
    background:var(--panel2); color:var(--ink); border:1px solid var(--line);
    border-radius:10px; font:inherit; font-size:17px; text-align:left;
    cursor:pointer;}
  button:active{background:#242b34;}
  button.primary{border-color:var(--amber); color:var(--amber); font-weight:600;}
  button.danger{border-color:var(--red); color:var(--red);}
  button.small{min-height:44px; font-size:15px;}
  button:disabled{opacity:.4;}
  button .sub{display:block; font-size:13px; color:var(--dim); font-weight:400; margin-top:2px;}

  .panel{background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:12px 14px; display:flex; flex-direction:column; gap:10px;}
  .row{display:flex; gap:10px;}
  .row>*{flex:1;}
  textarea{width:100%; min-height:110px; background:var(--panel2); color:var(--ink);
    border:1px solid var(--line); border-radius:10px; padding:10px; font:14px/1.4 Menlo,monospace;}
  label.toggle{display:flex; justify-content:space-between; align-items:center;
    min-height:48px; font-size:16px;}
  input[type=checkbox]{width:28px; height:28px; accent-color:var(--amber);}
  .msg{min-height:20px; font-size:14px;}
  .msg.ok{color:var(--green);} .msg.err{color:var(--red);}
</style>
</head>
<body>
<div id="app"></div>
<script>
"use strict";
/* ========================================================================
   ROADGRAVE core scaffold
   ======================================================================== */
const VERSION = 1;                 // save-format version (bump + add migration)
const BUILD   = "0.1.0";
const SAVE_KEY = "roadgrave.save";

/* ---- static content tables (grows each slice; balancing = editing DATA) */
const DATA = {
  cities: [
    { id:"kettle_rock", name:"Kettle Rock", blurb:"A scrapyard town built inside the bones of a dead refinery." },
  ],
};

/* ---- seeded RNG (mulberry32); seed lives in the save ------------------- */
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rng = mulberry32(1);
function rand(){ G.meta.rngCalls++; return rng(); }
function reseedRng(){ rng = mulberry32(G.meta.seed); for(let i=0;i<G.meta.rngCalls;i++) rng(); }

/* ---- central game state ------------------------------------------------ */
let G = null;

function newGame(){
  return {
    meta:{ version:VERSION, build:BUILD, ironman:false,
           seed:(Date.now()^(Math.random()*0xffffffff))>>>0, rngCalls:0 },
    screen:"title",
    driver:{ name:"Nameless", skills:{driving:0,gunnery:0,mechanics:0,scrounge:0}, xp:0, injuries:[] },
    scrap:0,
    inventory:[],
    vehicles:[],
    crew:[],
    world:{ location:"kettle_rock", day:1, fuel:0, supplies:0,
            factionRep:{ combine:0, gangs:0, zealots:0, militias:0 } },
    campaign:{ beatsDone:[], flags:{} },
    combat:null,
    log:[],
  };
}

/* ---- save / load / migrate -------------------------------------------- */
/* Migrations run in order from the save's version up to VERSION, so old
   saves always load. Each entry mutates s from version N to N+1. */
const MIGRATIONS = {
  // 1: s => { ...future changes...; s.meta.version = 2; },
};
function migrate(s){
  while(s.meta.version < VERSION){
    const m = MIGRATIONS[s.meta.version];
    if(!m) throw new Error("No migration from v"+s.meta.version);
    m(s);
  }
  return s;
}

let saveTimer = null;
function save(){                      // debounced autosave
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(G)); }catch(e){} }, 150);
}
function loadSave(){
  try{
    const raw = localStorage.getItem(SAVE_KEY);
    if(!raw) return null;
    return migrate(JSON.parse(raw));
  }catch(e){ return null; }
}
function hasSave(){ return !!localStorage.getItem(SAVE_KEY); }

/* ---- export / import --------------------------------------------------- */
const SAVE_PREFIX = "RG1.";
function exportSave(){
  return SAVE_PREFIX + btoa(unescape(encodeURIComponent(JSON.stringify(G))));
}
function importSave(str){
  str = (str||"").trim();
  if(!str.startsWith(SAVE_PREFIX)) throw new Error("Not a ROADGRAVE save string.");
  const s = migrate(JSON.parse(decodeURIComponent(escape(atob(str.slice(SAVE_PREFIX.length))))));
  G = s; reseedRng(); save();
}

/* ---- event log --------------------------------------------------------- */
function logMsg(t){ G.log.push(t); if(G.log.length>60) G.log.shift(); }

/* ---- screen state machine ---------------------------------------------
   Every screen is a render function. setScreen() -> autosave -> re-render.
   All state changes flow through G; render() redraws from G alone.       */
function setScreen(name){ G.screen = name; save(); render(); }

function el(html){ const d=document.createElement("div"); d.innerHTML=html; return d.firstElementChild; }

function render(){
  const app = document.getElementById("app");
  app.innerHTML = "";
  const screen = SCREENS[G ? G.screen : "title"] || SCREENS.title;
  screen(app);
  window.scrollTo(0,0);
}

function headerBar(){
  const city = DATA.cities.find(c=>c.id===G.world.location);
  return el(`<header>
    <span class="t">ROADGRAVE</span>
    <span class="stat">${city?city.name:"—"} · Day <b>${G.world.day}</b> · <b>${G.scrap}</b> scrap</span>
  </header>`);
}

/* ---- screens ----------------------------------------------------------- */
const SCREENS = {

  title(app){
    const m = el(`<main style="justify-content:center; text-align:center; gap:18px;">
      <h1>ROADGRAVE</h1>
      <p class="flavor">Two hundred years after the Undertow, the Gravel Sea eats the careless.<br>
      Seven cities. One road. Your move.</p>
      <div id="btns" style="display:flex; flex-direction:column; gap:10px;"></div>
      <p class="dim">v${BUILD} · slice 0 scaffold</p>
    </main>`);
    const btns = m.querySelector("#btns");
    if(hasSave() && G && G.campaign.flags.started){
      const c = el(`<button class="primary">Continue<span class="sub">Day ${G.world.day} · ${G.scrap} scrap</span></button>`);
      c.onclick = ()=> setScreen("hub");
      btns.appendChild(c);
    }
    const n = el(`<button>New Game<span class="sub">Start broke and carless in Kettle Rock</span></button>`);
    n.onclick = ()=>{
      if(hasSave() && !confirm("Overwrite the existing save?")) return;
      G = newGame(); rng = mulberry32(G.meta.seed);
      G.campaign.flags.started = true;
      logMsg("You wake in Kettle Rock with empty pockets and a driver's nerve.");
      setScreen("hub");
    };
    btns.appendChild(n);
    const s = el(`<button>Settings & Saves</button>`);
    s.onclick = ()=>{ if(!G) G = newGame(); setScreen("settings"); };
    btns.appendChild(s);
    app.appendChild(m);
  },

  hub(app){
    app.appendChild(headerBar());
    const m = el(`<main>
      <h2>Kettle Rock</h2>
      <p class="flavor">${DATA.cities[0].blurb} Coker fires burn day and night; everything smells of rust and hot tar.</p>
      <div id="places" style="display:flex; flex-direction:column; gap:10px;"></div>
      <h2>Log</h2>
      <div class="panel" id="log"></div>
      <button id="toSettings" class="small">Settings & Saves</button>
      <button id="toTitle" class="small">Title Screen</button>
    </main>`);
    const places = m.querySelector("#places");
    [ ["Garage / Workshop","Build and outfit your machine","Slice 1"],
      ["Market","Parts, ammo, fuel, gear","Slice 1"],
      ["Job Board","Courier and combat contracts","Slice 1"],
      ["The Slag Bar","Rumors and recruits","Slice 4"],
      ["The Crucible (Arena)","Earn your stake in the pit","Slice 2"],
    ].forEach(([name,sub,slice])=>{
      const b = el(`<button disabled>${name}<span class="sub">${sub} — coming in ${slice}</span></button>`);
      places.appendChild(b);
    });
    const logBox = m.querySelector("#log");
    (G.log.length?G.log.slice(-6):["(nothing yet)"]).forEach(t=>{
      logBox.appendChild(el(`<p class="dim">${t}</p>`));
    });
    m.querySelector("#toSettings").onclick = ()=> setScreen("settings");
    m.querySelector("#toTitle").onclick   = ()=> setScreen("title");
    app.appendChild(m);
  },

  settings(app){
    app.appendChild(headerBar());
    const m = el(`<main>
      <h2>Settings</h2>
      <div class="panel">
        <label class="toggle">Ironman (no defeat rescue — takes effect in Slice 2)
          <input type="checkbox" id="ironman" ${G.meta.ironman?"checked":""}></label>
      </div>
      <h2>Save</h2>
      <div class="panel">
        <p class="dim">Autosave is always on. Export a save string as a backup; import restores it exactly.</p>
        <button id="doExport" class="small">Export save to text</button>
        <textarea id="saveBox" placeholder="Save string appears here / paste one to import"></textarea>
        <div class="row">
          <button id="doCopy" class="small">Copy</button>
          <button id="doImport" class="small">Import</button>
        </div>
        <p class="msg" id="msg"></p>
      </div>
      <h2>Danger</h2>
      <div class="panel">
        <button id="doReset" class="danger small">Erase save and restart</button>
      </div>
      <button id="back" class="primary">Back</button>
    </main>`);
    const msg = (t,ok)=>{ const e=m.querySelector("#msg"); e.textContent=t; e.className="msg "+(ok?"ok":"err"); };
    m.querySelector("#ironman").onchange = e=>{ G.meta.ironman = e.target.checked; save(); };
    m.querySelector("#doExport").onclick = ()=>{ m.querySelector("#saveBox").value = exportSave(); msg("Exported. Copy it somewhere safe.", true); };
    m.querySelector("#doCopy").onclick = async ()=>{
      const box = m.querySelector("#saveBox");
      if(!box.value){ msg("Nothing to copy — export first.", false); return; }
      try{ await navigator.clipboard.writeText(box.value); msg("Copied to clipboard.", true); }
      catch(e){ box.select(); msg("Tap and hold the text to copy manually.", false); }
    };
    m.querySelector("#doImport").onclick = ()=>{
      try{ importSave(m.querySelector("#saveBox").value); msg("Save imported.", true); render(); }
      catch(e){ msg("Import failed: "+e.message, false); }
    };
    m.querySelector("#doReset").onclick = ()=>{
      if(!confirm("Erase the save? This cannot be undone unless you exported a backup.")) return;
      localStorage.removeItem(SAVE_KEY);
      G = newGame(); rng = mulberry32(G.meta.seed);
      setScreen("title");
    };
    m.querySelector("#back").onclick = ()=> setScreen(G.campaign.flags.started ? "hub" : "title");
    app.appendChild(m);
  },
};

/* ---- boot -------------------------------------------------------------- */
(function boot(){
  const loaded = loadSave();
  if(loaded){ G = loaded; reseedRng(); }
  else { G = newGame(); rng = mulberry32(G.meta.seed); G.screen = "title"; }
  if(!SCREENS[G.screen]) G.screen = "title";   // never boot into a dead screen
  render();
})();
</script>
</body>
</html>
